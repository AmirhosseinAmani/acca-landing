  <rect x="344" y="438" width="536" height="46" rx="23" fill="#C6A768" opacity="0.12"/>

  <text x="612" y="390" text-anchor="middle" font-size="74" font-family="Arial, sans-serif" font-weight="800" letter-spacing="10" fill="#071A3D">99***</text>
