  <path d="M805 612C940 520 1060 508 1198 568" class="thin" opacity="0.08"/>
  
  <rect x="402" y="118" width="310" height="500" rx="48" fill="#071A3D" filter="url(#softShadow)"/>
  <rect x="432" y="168" width="250" height="390" rx="28" fill="#FFFFFF"/>
  <circle cx="557" cy="596" r="16" fill="#F7F1E8"/>
  <rect x="474" y="226" width="166" height="18" rx="9" fill="#008767"/>
