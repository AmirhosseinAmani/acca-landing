  <path d="M805 612C940 520 1060 508 1198 568" class="thin" opacity="0.08"/>
  
  <g transform="rotate(-8 520 362)">
  <rect x="270" y="238" width="470" height="250" rx="34" fill="#FFFFFF" stroke="#DDE3E6" stroke-width="3" filter="url(#softShadow)"/>
