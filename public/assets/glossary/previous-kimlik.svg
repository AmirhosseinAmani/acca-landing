  <rect x="312" y="416" width="386" height="46" rx="23" fill="#C6A768" opacity="0.12"/>
</g>
  <g transform="rotate(6 742 344)">
  <rect x="542" y="188" width="500" height="280" rx="34" fill="#FFFFFF" stroke="#DDE3E6" stroke-width="3" filter="url(#softShadow)"/>
  <circle cx="620" cy="270" r="38" fill="url(#green)"/>
  <rect x="682" y="242" width="295" height="16" rx="8" fill="#071A3D" opacity="0.25"/>
