    <filter id="smallShadow" x="-20%" y="-25%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#071A3D" flood-opacity="0.13"/>
    </filter>
    <style>
      .line{stroke:#071A3D;stroke-width:12;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .thin{stroke:#071A3D;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .mutedLine{stroke:#99A0AE;stroke-width:8;stroke-linecap:round;fill:none}
      .paper{fill:#FFFFFF;stroke:#E6E1D8;stroke-width:3;filter:url(#smallShadow)}
      .chip{fill:#F7F1E8;stroke:#E8DDCA;stroke-width:3}
    </style>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
