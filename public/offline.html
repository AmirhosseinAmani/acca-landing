<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#071A3D" />
    <title>ACCA EDU — Study in Turkey & International Student Placement | Offline</title>
    <style>
      @font-face {
        font-family: "Vazirmatn";
        font-style: normal;
        font-weight: 400 900;
        font-display: swap;
        src: url("/fonts/vazirmatn-arabic.woff2") format("woff2");
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: "Vazirmatn", sans-serif;
        background: radial-gradient(circle at top, rgba(198,167,104,0.18), transparent 34%), #071A3D;
        color: #fffaf0;
      }
      main {
        width: min(460px, 100%);
        border: 1px solid rgba(255,255,255,0.16);
        border-radius: 32px;
        padding: 32px;
        background: rgba(255,255,255,0.08);
        box-shadow: 0 28px 90px rgba(0,0,0,0.28);
        backdrop-filter: blur(20px);
      }
      img { width: 72px; height: 72px; border-radius: 22px; margin-bottom: 24px; }
      h1 { margin: 0 0 14px; font-size: 28px; line-height: 1.25; }
      p { margin: 0; color: rgba(255,250,240,0.78); line-height: 1.9; font-size: 15px; }
      a {
        display: inline-flex;
        margin-top: 24px;
        border-radius: 999px;
        padding: 12px 18px;
        background: #C6A768;
        color: #071A3D;
        text-decoration: none;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon-192x192.png" alt="ACCA EDU" />
      <h1>اتصال اینترنت برقرار نیست</h1>
      <p>ACCA EDU به صورت اپلیکیشن آماده است. وقتی دوباره آنلاین شدید، صفحه را تازه‌سازی کنید تا آخرین اطلاعات دانشگاه‌ها و شهریه‌ها نمایش داده شود.</p>
      <a href="/">تلاش دوباره</a>
    </main>
  </body>
</html>
